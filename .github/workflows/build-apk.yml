          B64

          cat > "$A/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DuoMission"
          include ':app'
          EOF

          cat > "$A/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > "$A/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat > "$A/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sayeed.duomission'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.sayeed.duomission'
                  minSdk 24
                  targetSdk 34
                  versionCode (project.findProperty('vc') ?: '1').toInteger()
                  versionName '1.0'
              }

              signingConfigs {
                  duo {
                      storeFile file('duo.keystore')
                      storeType 'pkcs12'
                      storePassword 'duomission'
                      keyAlias 'duo'
                      keyPassword 'duomission'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.duo
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF

          cat > "$A/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Duo Mission"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode|density"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$R/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          EOF

          cat > "$R/values/colors.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#8CC4F2</color>
          </resources>
          EOF

          cat > "$R/drawable/ic_fg.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/bear"
              android:insetLeft="16%"
              android:insetTop="16%"
              android:insetRight="16%"
              android:insetBottom="16%" />
          EOF

          cat > "$R/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > "$J/MainActivity.java" <<'EOF'
          package com.sayeed.duomission;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final String START = "file:///android_asset/www/index.html";
              private WebView web;
              private float topDp = 0f;
              private float bottomDp = 0f;
              private boolean loaded = false;

              public class InsetsBridge {
                  @JavascriptInterface
                  public float top() { return topDp; }

                  @JavascriptInterface
                  public float bottom() { return bottomDp; }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window w = getWindow();
                  w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  w.setStatusBarColor(Color.TRANSPARENT);
                  w.setNavigationBarColor(Color.TRANSPARENT);
                  if (Build.VERSION.SDK_INT >= 29) {
                      w.setStatusBarContrastEnforced(false);
                      w.setNavigationBarContrastEnforced(false);
                  }
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = w.getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      w.setAttributes(lp);
                  }
                  if (Build.VERSION.SDK_INT >= 30) {
                      w.setDecorFitsSystemWindows(false);
                      WindowInsetsController c = w.getInsetsController();
                      if (c != null) {
                          c.setSystemBarsAppearance(WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS,
                                  WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS);
                          c.setSystemBarsAppearance(0, WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS);
                      }
                  } else {
                      int f = View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION;
                      if (Build.VERSION.SDK_INT >= 23) {
                          f |= View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                      }
                      w.getDecorView().setSystemUiVisibility(f);
                  }

                  web = new WebView(this);
                  web.setBackgroundColor(Color.WHITE);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(false);
                  web.addJavascriptInterface(new InsetsBridge(), "DuoInsets");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          pushInsets();
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if ("file".equals(u.getScheme())) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }
                  });

                  web.setOnApplyWindowInsetsListener(new View.OnApplyWindowInsetsListener() {
                      @Override
                      public WindowInsets onApplyWindowInsets(View v, WindowInsets insets) {
                          float d = getResources().getDisplayMetrics().density;
                          int t;
                          int b;
                          int kb = 0;
                          if (Build.VERSION.SDK_INT >= 30) {
                              android.graphics.Insets bars = insets.getInsets(
                                      WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout());
                              t = bars.top;
                              b = bars.bottom;
                              if (insets.isVisible(WindowInsets.Type.ime())) {
                                  kb = insets.getInsets(WindowInsets.Type.ime()).bottom;
                              }
                          } else {
                              t = insets.getSystemWindowInsetTop();
                              int stable = insets.getStableInsetBottom();
                              b = stable;
                              kb = Math.max(0, insets.getSystemWindowInsetBottom() - stable);
                          }
                          topDp = t / d;
                          bottomDp = (kb > 0 ? 0 : b) / d;
                          v.setPadding(0, 0, 0, kb);
                          loadOnce();
                          pushInsets();
                          return insets;
                      }
                  });

                  setContentView(web);
                  web.requestApplyInsets();
                  web.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          loadOnce();
                      }
                  }, 700);
              }

              private void loadOnce() {
                  if (loaded) {
                      return;
                  }
                  loaded = true;
                  web.loadUrl(START);
              }

              private void pushInsets() {
                  if (web == null || !loaded) {
                      return;
                  }
                  String js = "(function(){var r=document.documentElement;if(r){"
                          + "r.style.setProperty('--sat','" + topDp + "px');"
                          + "r.style.setProperty('--sab','" + bottomDp + "px');}})()";
                  web.evaluateJavascript(js, null);
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

          echo "Android project generated:"
          find "$A" -type f | sort


      - name: Build APK
        working-directory: android
        run: gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DuoMission.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Duo Mission APK (latest)
          body: Download DuoMission.apk, open it on your phone and install.
          files: DuoMission.apk
