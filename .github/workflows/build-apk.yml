name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'icon-512.png'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        run: |
          set -euo pipefail
          A=android
          J=$A/app/src/main/java/com/sayeed/duomission
          R=$A/app/src/main/res
          mkdir -p "$J" "$A/app/src/main/assets/www" "$R/values" "$R/drawable" "$R/drawable-nodpi" "$R/mipmap-anydpi-v26" "$R/mipmap-nodpi"

          # ---- web app + icon taken from the repo root
          cp index.html "$A/app/src/main/assets/www/index.html"
          cp icon-512.png "$R/drawable-nodpi/bear.png"
          cp icon-512.png "$R/mipmap-nodpi/ic_launcher.png"

          # ---- the runner already has the Android SDK; just point Gradle at it
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > "$A/local.properties"

          # ---- fixed signing key (so every new APK installs over the old one)
