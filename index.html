<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{if(window.DuoInsets){var _r=document.documentElement.style;_r.setProperty("--sat",DuoInsets.top()+"px");_r.setProperty("--sab",DuoInsets.bottom()+"px")}}catch(e){}</script>
<title>Duolingo Mission</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8cc4f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duo Mission">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1);
--bg:#dcdde1;--ink:#1d1d22;--mute:#8c8c96;--line:rgba(20,20,60,.06);
--blue:#6c8cf0;--indigo:#5b45d6;--orange:#ff6a1a;--amber:#f5a623;--pink:#f0589a;--green:#46b866;--sky:#5b9cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:#fff;color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;font-feature-settings:"tnum"}
/* background: soft drifting colour glow from the app palette */
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(14vw,10vh) scale(1.2)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-16vw,-8vh) scale(.9)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(10vw,-14vh) scale(1.25)}}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:#fff}
.bg svg{position:absolute;left:0;width:100%;height:auto;display:block}
.bg .bgs{top:0}
.bg .bgh{bottom:0}
.wrap{max-width:480px;margin:0 auto;padding:calc(16px + max(env(safe-area-inset-top,0px),var(--sat,0px))) clamp(12px,4vw,18px) calc(110px + max(env(safe-area-inset-bottom,0px),var(--sab,0px)))}
svg{display:block}
.ic svg,.ic{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
@keyframes navin{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.95)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes badgein{from{opacity:0;transform:scale(0) rotate(-40deg)}to{opacity:1;transform:scale(1)}}
@keyframes cellin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(91,69,214,.5)}50%{box-shadow:0 0 0 6px rgba(91,69,214,0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
.bump{display:inline-block;animation:bump .5s var(--spring)}
.view{display:none}.view.on{display:block}
.card{position:relative;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.8);border-radius:34px;padding:clamp(16px,5vw,22px);margin-bottom:14px;overflow:hidden;
box-shadow:0 10px 28px rgba(30,30,70,.07),0 2px 5px rgba(30,30,70,.04);animation:rise .8s var(--ease) both;animation-delay:calc(var(--d,0)*80ms)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pair .card{margin:0}
.k{font-size:14px;color:var(--mute);font-weight:500}
.v{font-size:clamp(30px,9vw,38px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.v small{font-size:.5em;color:var(--mute);font-weight:500;letter-spacing:0}

/* header */
.top{display:flex;align-items:center;gap:12px;margin:0 4px 18px;animation:drop .7s var(--spring) both}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;flex:none;
background:linear-gradient(150deg,#8fb4ff,#8a6cf0 60%,#f0589a);box-shadow:0 8px 18px rgba(110,90,230,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.top .hi{font-size:19px;font-weight:600;letter-spacing:-.01em}
.top .k{font-size:13px}
.round{margin-left:auto;width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;
box-shadow:0 6px 16px rgba(30,30,70,.1);transition:transform .35s var(--spring)}
.round:active{transform:scale(.86) rotate(40deg)}.round svg{width:22px;height:22px}

#banners:empty{display:none}
.banner{border-radius:22px;padding:12px 16px;margin-bottom:12px;font-size:14px;font-weight:500;animation:drop .6s var(--spring) both}
.b-red{background:#ffe3e7;color:#a01c2d}.b-green{background:#d9f3d2;color:#1f6a2c}

/* today card */
.tbody{display:flex;align-items:center;gap:10px;margin-top:6px}
.dots{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,3vw,14px)}
.dcol{--c:var(--blue)}
.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:8px}
.dg i{aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--c) 15%,transparent);transition:background .45s,transform .6s var(--spring)}
.dg i.on{background:var(--c);transform:scale(1.15)}
.dl{display:flex;align-items:center;gap:4px;color:var(--c);font-weight:600;font-size:14px;white-space:nowrap}
.dl svg{width:15px;height:15px}
.gauge{position:relative;width:clamp(96px,30vw,124px);flex:none}
.gauge svg{width:100%}
.gauge line{stroke:rgba(108,140,240,.16);stroke-width:3.2;stroke-linecap:round;transition:stroke .45s}
.gn{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gn b{font-size:clamp(34px,10vw,44px);font-weight:600;letter-spacing:-.03em;line-height:1}
.gn small{font-size:13px;color:var(--blue);font-weight:500}
.strip{display:grid;grid-template-columns:repeat(4,1fr);margin:18px calc(-1*clamp(16px,5vw,22px)) calc(-1*clamp(16px,5vw,22px));border-top:1px solid var(--line);background:#f3f3f6}
.sc{position:relative;border:0;background:transparent;padding:12px 0 10px;display:grid;justify-items:center;gap:2px;cursor:pointer;color:#55555f;font-family:inherit;
border-right:1px solid var(--line);transition:background .4s,transform .3s var(--spring)}
.sc:last-child{border:0}.sc:active{transform:scale(.9)}
.sc svg{width:24px;height:24px}.sc small{font-size:11px;color:var(--mute);font-weight:500}
.sc.ok{background:#d9f3d2;color:#1f6a2c}.sc.late{background:#ffe3e7;color:#a01c2d}
.sc.now svg{color:var(--indigo);animation:float 2s ease-in-out infinite}
.sc .bd{position:absolute;top:6px;right:calc(50% - 22px);width:16px;height:16px;border-radius:50%;background:var(--green);display:grid;place-items:center;opacity:0;transform:scale(0)}
.sc .bd svg{width:10px;height:10px;stroke-width:3.5;color:#fff}.sc.ok .bd{animation:badgein .55s var(--spring) both}

/* plan slider */
.prow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chips{display:flex;gap:12px;font-weight:600;font-size:clamp(17px,5vw,21px)}
.chips span{display:flex;align-items:center;gap:5px}.chips svg{width:20px;height:20px}
.track{position:relative;height:14px;margin:22px 10px 0;border-radius:9px;background:linear-gradient(90deg,#ff5a00,#ffb020 30%,#e6e9f2 50%,#8aa8ff 72%,#5b45d6);box-shadow:0 4px 14px rgba(255,120,40,.22)}
.tmask{position:absolute;top:0;right:0;bottom:0;border-radius:0 9px 9px 0;background:rgba(255,255,255,.78);transition:width .9s var(--ease)}
.knob{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #dfe3ef;transform:translate(-50%,-50%);box-shadow:0 3px 10px rgba(0,0,0,.2);transition:left .9s var(--spring)}
.ticks{position:relative;height:36px;margin:14px 10px 0;border-top:1px solid var(--line)}
.ticks span{position:absolute;top:8px;transform:translateX(-50%);font-size:14px;color:var(--mute);font-weight:500;text-align:center;line-height:1.2}
.ticks span.m{color:var(--ink);font-weight:600}.ticks small{display:block;font-size:10px;color:var(--mute);font-weight:500}
.info{position:absolute;right:16px;bottom:14px;width:26px;height:26px;border:0;border-radius:50%;background:#f3f3f6;color:var(--mute);display:grid;place-items:center;cursor:pointer;transition:transform .4s var(--spring)}
.info svg{width:15px;height:15px}.info.open{transform:rotate(180deg)}
.why{max-height:0;opacity:0;font-size:13px;line-height:1.45;color:var(--mute);transition:max-height .5s var(--ease),opacity .4s,margin .4s}
.why.open{max-height:90px;opacity:1;margin-top:10px}

/* battery */
.bank{background:linear-gradient(170deg,#5cb878 0%,#a5dcb3 45%,#eaf7ec 100%);color:#fff}
.bank .k{color:rgba(255,255,255,.9);display:flex;align-items:center;gap:5px}.bank .k svg{width:15px;height:15px}
.bank .v{margin:6px 0 2px}.bank .s{font-size:13px;color:rgba(255,255,255,.88);font-weight:500}
.bat{display:flex;gap:2px;height:30px;background:#fff;border-radius:10px;padding:5px 6px;margin:12px 0 10px;box-shadow:0 4px 12px rgba(0,60,20,.12)}
.bat i{flex:1;border-radius:2px;background:#e3e8e4;transition:background .4s,transform .5s var(--spring)}
.bat i.on{background:linear-gradient(#9be83c,#5cc43a);transform:scaleY(1.05)}
.bc{display:flex;gap:6px;font-size:12px;font-weight:600}
.bc span{flex:1;text-align:center;padding:6px 0;border-radius:10px;background:rgba(255,255,255,.7)}
.bc .g{color:#1f9a40}.bc .r{color:#e0384d}

/* arc */
.arcc{display:flex;align-items:center;gap:6px;color:#4a4a55;font-weight:500;font-size:15px}.arcc svg{width:16px;height:16px;color:var(--sky)}
.arcw{position:relative;margin-top:6px}.arcw svg{width:100%}
.arcw .t{stroke:#eef2fb}.arcw .a{stroke:var(--sky);transition:stroke-dasharray 1s var(--ease)}
.plus{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;border:0;background:#eef0f6;color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 10px rgba(30,30,70,.1);transition:transform .35s var(--spring)}
.plus:active{transform:translateX(-50%) scale(.82)}.plus svg{width:22px;height:22px}
.arcn{text-align:center;margin-top:8px}.arcn b{font-size:20px;font-weight:600}.arcn div{color:var(--sky);font-size:13px;font-weight:500}

/* rings */
.rings{display:flex;justify-content:space-around;margin-top:14px;gap:8px}
.rg{position:relative;width:clamp(74px,24vw,92px);text-align:center}
.rg svg{width:100%;transform:rotate(-90deg);filter:drop-shadow(0 4px 8px rgba(30,30,70,.1))}
.rg circle{fill:none;stroke-width:9;stroke-linecap:round}.rt{stroke:#f0f1f5}
.ra{transition:stroke-dasharray 1.2s var(--ease)}
.rg b{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:clamp(15px,4.6vw,19px);font-weight:600}
.rg em{display:block;font-style:normal;margin-top:6px;font-size:13px;color:var(--mute);font-weight:500}
.sbig{display:flex;justify-content:center;margin:6px 0 14px}.sbig .rg{width:clamp(120px,38vw,150px)}.sbig b{font-size:clamp(26px,8vw,34px)}
.sbig .rg circle{stroke-width:8}
.srow{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}.srow b{display:block;font-size:20px;color:var(--ink);font-weight:600;margin-top:2px}

/* map */
.h{font-size:17px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px;margin-top:14px}
.cell{aspect-ratio:1;border-radius:50%;background:#f1f2f6;display:grid;place-items:center;font-size:11px;font-weight:500;color:#a0a0ac}
.cell.enter{animation:cellin .55s var(--spring) both;animation-delay:calc(var(--i)*16ms + .3s)}
.cell.g{background:linear-gradient(145deg,#a4e08a,#46b866);color:#fff;box-shadow:0 3px 8px rgba(70,184,102,.35)}
.cell.gold{background:linear-gradient(145deg,#ffd27a,#f5a623);color:#fff;box-shadow:0 3px 8px rgba(245,166,35,.35)}
.cell.r{background:linear-gradient(145deg,#ff9aa8,#e5485f);color:#fff}
.cell.today{outline:2px solid var(--indigo);outline-offset:2px;animation:pulse 2.2s ease-in-out infinite}
.sec{display:flex;justify-content:space-between;font-size:14px;margin:14px 2px 6px;font-weight:500}.sec span:last-child{color:var(--mute)}
.bar{height:10px;border-radius:8px;background:#f0f1f5;overflow:hidden}
.fill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#ff8a3d,#ffb020,#8aa8ff,#5b45d6);background-size:200% 100%;transition:width 1s var(--ease);animation:shine 4s linear infinite}

/* settings */
label{display:block;font-size:13px;color:var(--mute);font-weight:500;margin:16px 4px 6px}label:first-of-type{margin-top:10px}
input{width:100%;font-family:inherit;font-size:16px;padding:14px 18px;border-radius:22px;border:0;background:#f3f3f6;color:var(--ink);outline:none;transition:box-shadow .3s,transform .3s var(--spring)}
input:focus{box-shadow:0 0 0 3px rgba(91,69,214,.3);transform:scale(1.015)}

/* nav: liquid glass */
@keyframes sheen{0%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(260%) skewX(-20deg)}}
.nav{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(14px + max(env(safe-area-inset-bottom,0px),var(--sab,0px)));z-index:20;width:min(300px,calc(100% - 40px));padding:8px;border-radius:40px;
background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.18) 55%,rgba(255,255,255,.4));
-webkit-backdrop-filter:blur(18px) saturate(1.9) brightness(1.06);backdrop-filter:blur(18px) saturate(1.9) brightness(1.06);
border:1px solid rgba(255,255,255,.65);
box-shadow:0 18px 40px rgba(30,30,70,.2),0 2px 6px rgba(30,30,70,.08),inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1.5px 2px rgba(255,255,255,.45),inset 0 0 22px rgba(255,255,255,.35);
overflow:hidden;animation:navin .9s var(--ease) .5s both}
.nav::before{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);pointer-events:none;animation:sheen 6s ease-in-out 1.5s infinite}
.nav::after{content:"";position:absolute;left:12%;right:12%;top:2px;height:42%;border-radius:40px;background:linear-gradient(rgba(255,255,255,.55),transparent);pointer-events:none}
.nav-in{position:relative;display:grid;grid-template-columns:repeat(3,1fr);height:50px}
.ind{position:absolute;top:0;left:0;width:33.333%;height:100%;display:grid;place-items:center;pointer-events:none;transform:translateX(calc(var(--i,0)*100%));transition:transform .65s var(--spring)}
.ind::after{content:"";width:100%;height:100%;border-radius:30px;background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(255,255,255,.3));
border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(30,30,70,.14),inset 0 1px 1px #fff,inset 0 -2px 6px rgba(91,69,214,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.nb{position:relative;z-index:2;height:50px;width:100%;border-radius:30px;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;color:#4a4a58;transition:transform .35s var(--spring),color .35s}
.nb:active{transform:scale(.85)}.nb.on{color:var(--indigo)}.nb svg{width:24px;height:24px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
.avatar{position:relative;padding:2px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#fff}
#syncDot{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;background:#b8b8c2;transition:background .3s}
#syncDot.ok{background:#46b866}#syncDot.pend{background:#f5a623}#syncDot.err{background:#e5485f}
.sbtn{width:100%;margin-top:14px;padding:14px 18px;border:0;border-radius:22px;font-family:inherit;font-size:16px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(150deg,#8fb4ff,#8a6cf0 60%,#f0589a);box-shadow:0 8px 18px rgba(110,90,230,.3);transition:transform .3s var(--spring)}
.sbtn:active{transform:scale(.97)}
#ghStatus{margin-top:12px;font-size:13px;color:var(--mute);line-height:1.4;word-break:break-word}
</style>
</head>

function splitSlots(T){var b=Math.floor(T/3),r=T%3,g=[b,b,b],o=[2,0,1];for(var i=0;i<r;i++)g[o[i]]++;return g}
function mins(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function nowMins(){var n=new Date();return n.getHours()*60+n.getMinutes()}
function curSlot(){var n=nowMins();for(var i=0;i<3;i++)if(n<=mins(state.ends[i]))return i;return 2}
function calcStreak(){var d=new Date(),n=0;if(count(dateKey(d))<MIN)d.setDate(d.getDate()-1);
 while(dateKey(d)>=state.start&&count(dateKey(d))>=MIN){n++;d.setDate(d.getDate()-1)}return n}
function bestDay(){var b=0;for(var k in state.days)b=Math.max(b,sum(state.days[k]));return b}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function setText(id,v){var el=$(id);v=String(v);if(el.textContent!==v){el.textContent=v;if(ready&&!REDUCED){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}}}

/* ---------- build once ---------- */
function ringHTML(i,g,label){return '<div class="rg"><svg viewBox="0 0 80 80"><circle class="rt" cx="40" cy="40" r="33"/><circle class="ra" id="ra'+i+'" cx="40" cy="40" r="33" pathLength="100" stroke="url(#'+g+')" stroke-dasharray="0 100"/></svg><b id="rv'+i+'">0%</b>'+(label?'<em>'+label+'</em>':'')+'</div>'}
function setRing(i,p,txt){p=Math.max(0,Math.min(100,p));$("ra"+i).setAttribute("stroke-dasharray",p+" 100");$("rv"+i).textContent=txt}
var GT=40;
function buildStatic(){
 document.querySelectorAll("[data-ic]").forEach(function(e){e.innerHTML=ic(e.getAttribute("data-ic"))});
 var h="",st="";
 for(var s=0;s<3;s++){
  h+='<div class="dcol" style="--c:'+SC[s]+'"><div class="dg" id="dg'+s+'">'+Array(25).join("<i></i>")+'</div><div class="dl">'+ic(SI[s])+'<span><span id="cnt'+s+'">0</span>/<span id="goal'+s+'">0</span></span></div></div>';
  st+='<button class="sc ic" id="sc'+s+'" data-p="'+s+'" aria-label="+1 '+SLOT_NAMES[s]+'">'+ic(SI[s])+'<small id="sub'+s+'"></small><span class="bd">'+ic("check")+'</span></button>'}
 st+='<button class="sc ic" id="undo" aria-label="Undo one">'+ic("undo")+'<small>undo</small></button>';
 $("dots").innerHTML=h;$("strip").innerHTML=st;
 for(s=0;s<3;s++){var dots=$("dg"+s).children;for(var j=0;j<24;j++)dots[j].style.transitionDelay=((23-j)*9)+"ms"}
 document.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){change(+this.getAttribute("data-p"),1,this)}});
 $("undo").onclick=function(){change(lastSlot==null?curSlot():lastSlot,-1,this)};
 var g="";for(var i=0;i<GT;i++){var a=(135+i*270/(GT-1))*Math.PI/180;
  g+='<line id="gt'+i+'" x1="'+(60+46*Math.cos(a)).toFixed(1)+'" y1="'+(60+46*Math.sin(a)).toFixed(1)+'" x2="'+(60+55*Math.cos(a)).toFixed(1)+'" y2="'+(60+55*Math.sin(a)).toFixed(1)+'" style="transition-delay:'+(i*14)+'ms"/>'}
 $("gsvg").innerHTML=g;
 var b="";for(i=0;i<24;i++)b+='<i style="transition-delay:'+(i*25)+'ms"></i>';$("bat").innerHTML=b;
 var tk="";for(i=0;i<=BONUS;i++)tk+='<span id="tk'+i+'" style="left:'+(i*20)+'%">'+i+'</span>';$("ticks").innerHTML=tk;
 $("rings").innerHTML=ringHTML(0,"gLime","Today")+ringHTML(1,"gBlue","Course")+ringHTML(2,"gAmber","Days");
 $("sring").innerHTML=ringHTML(3,"gOrange","");
 var sh="";SECTIONS.forEach(function(sec,i){sh+='<div class="sec"><span>'+sec.name+'</span><span id="secT'+i+'"></span></div><div class="bar"><div class="fill" id="secF'+i+'"></div></div>'});
 $("secs").innerHTML=sh;
 $("dateTxt").textContent=new Date().toLocaleDateString("en",{weekday:"long",month:"short",day:"numeric"});
 $("infoBtn").onclick=function(){this.classList.toggle("open");$("why").classList.toggle("open")};
 $("plusBtn").onclick=function(){change(curSlot(),1,this)};
}

/* ---------- render ---------- */
var lastBanner="";
function render(){
 var key=dateKey(new Date()),plan=todayPlan(),arr=dayArr(key),t=sum(arr),goals=splitSlots(plan.target),finished=totalDone()>=TOTAL;
 setText("today",t);setText("today2",t);setText("gnum",t);setText("target",plan.target);
 var gp=Math.min(1,t/plan.target);
 $("glab").textContent=t>=BONUS?"bonus":t>=plan.target?"done":t>=plan.min?"good":t>0?"started":"start";
 for(var i=0;i<GT;i++){var on=i<Math.round(gp*GT);$("gt"+i).style.stroke=on?"hsl("+(262-i*1.1)+",78%,"+(72-i*.5)+"%)":""}
 var kp=Math.min(100,t/BONUS*100);$("knob").style.left=kp+"%";$("tmask").style.width=(100-kp)+"%";
 for(i=0;i<=BONUS;i++){var tk=$("tk"+i);tk.className=(i===plan.min||i===plan.target||i===BONUS)?"m":"";
  tk.innerHTML=i+(i===plan.min?"<small>min</small>":i===plan.target&&i!==plan.min?"<small>goal</small>":i===BONUS?"<small>bonus</small>":"")}
 $("dayInfo").textContent="Day "+Math.min(dayNumber(),GOAL_DAYS)+" of "+GOAL_DAYS;
 $("why").textContent=plan.caught?"Catch-up: ager din kom hoyechilo, tai aaj "+plan.target+" ta. 45 din er deadline bachbe.":"Normal: roj 3 ta. Minimum 2 ta korlei din jita.";

 var b="",yk=dateKey(new Date(Date.now()-86400000));
 if(finished)b+='<div class="banner b-green"><b>Mission complete!</b></div>';
 if(dayNumber()>1&&yk>=state.start&&count(yk)<MIN)b+='<div class="banner b-red"><b>Kal fail, streak 0.</b>'+(state.penalty?' Penalty: '+esc(state.penalty):'')+'</div>';
 if(t>=plan.target&&!finished)b+='<div class="banner b-green"><b>Target done!</b>'+(state.reward?' Reward: '+esc(state.reward):'')+'</div>';
 else if(nowMins()>mins(state.ends[2])&&t<plan.min&&!finished)b+='<div class="banner b-red"><b>Aaj minimum '+plan.min+' ta hoyni.</b></div>';
 if(b!==lastBanner){$("banners").innerHTML=b;lastBanner=b}

 var now=nowMins(),cur=curSlot();
 for(var s=0;s<3;s++){var g=goals[s],c=arr[s],cls="sc ic",left=mins(state.ends[s])-now;
  if(g>0&&c>=g)cls+=" ok";else if(g>0&&left<0)cls+=" late";else if(s===cur)cls+=" now";
  var el=$("sc"+s);if(el.className!==cls)el.className=cls;
  $("sub"+s).textContent=state.ends[s];setText("cnt"+s,c);$("goal"+s).textContent=g;
  var n=g>0?Math.round(Math.min(1,c/g)*24):(c>0?24:0),dots=$("dg"+s).children;
  for(var j=0;j<24;j++)dots[j].className=j>=24-n?"on":""}

 var st=calcStreak();setText("streak",st);setText("total",totalDone());setText("total2",totalDone());setText("best",bestDay());
 var done=totalDone(),pct=Math.round(done/TOTAL*100);
 setText("allPct",pct);$("allText").textContent=done+" / "+TOTAL+" units";
 var bars=$("bat").children,bn=Math.round(pct/100*24);for(i=0;i<24;i++)bars[i].className=i<bn?"on":"";
 $("bcT").textContent="+"+t;$("bcL").textContent="-"+(TOTAL-done);
 var dn=Math.min(dayNumber(),GOAL_DAYS),dp=Math.round(dn/GOAL_DAYS*100);
 $("arcA").setAttribute("stroke-dasharray",dp+" 100");setText("dayBig",dn+" / "+GOAL_DAYS);$("dayPct").textContent=dp+"% complete";
 setRing(0,gp*100,Math.round(gp*100)+"%");setRing(1,pct,pct+"%");setRing(2,dp,dp+"%");setRing(3,st/GOAL_DAYS*100,st);

 var gh="";for(var d=0;d<GOAL_DAYS;d++){var k=dateKey(dateAt(d)),c2=count(k),cl="cell";
  if(k<key)cl+=c2>=BONUS?" gold":(c2>=MIN?" g":" r");else if(k===key)cl+=" today"+(c2>=BONUS?" gold":(c2>=MIN?" g":""));
  if(!ready)cl+=" enter";gh+='<div class="'+cl+'" style="--i:'+d+'">'+(d+1)+'</div>'}
 $("grid").innerHTML=gh;
 var l2=done;SECTIONS.forEach(function(sec,i){var dd=Math.max(0,Math.min(sec.units,l2));l2-=sec.units;
  $("secT"+i).textContent=dd+"/"+sec.units;$("secF"+i).style.width=Math.round(dd/sec.units*100)+"%"});
}

function burst(el){
 if(REDUCED||!document.body.animate)return;
 var r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0},cx=r.left+r.width/2,cy=r.top+r.height/2;
 var cols=["#5b45d6","#46b866","#f5a623","#f0589a","#6c8cf0","#ff6a1a","#c6e81c"];
 for(var i=0;i<26;i++){var p=document.createElement("i");
  p.style.cssText="position:fixed;z-index:50;pointer-events:none;width:9px;height:9px;border-radius:"+(i%2?"50%":"2px")+";left:"+cx+"px;top:"+cy+"px;background:"+cols[i%cols.length];
  document.body.appendChild(p);var a=Math.random()*Math.PI*2,dist=70+Math.random()*110;
  var an=p.animate([{transform:"translate(0,0) scale(1) rotate(0)",opacity:1},{transform:"translate("+Math.cos(a)*dist+"px,"+(Math.sin(a)*dist-50)+"px) scale(.4) rotate("+Math.random()*540+"deg)",opacity:0}],{duration:700+Math.random()*400,easing:"cubic-bezier(.2,.8,.3,1)"});
  an.onfinish=(function(n){return function(){n.remove()}})(p)}
}
function change(slot,delta,src){
 var key=dateKey(new Date()),plan=todayPlan(),a=(state.days[key]||[0,0,0]).slice(),before=sum(a);
 a[slot]=Math.max(0,a[slot]+delta);state.days[key]=a;(state.dayUpd=state.dayUpd||{})[key]=Date.now();lastSlot=slot;var after=sum(a);save();render();
 try{if(navigator.vibrate)navigator.vibrate(delta>0?12:6)}catch(e){}
 if(delta>0&&((before<plan.min&&after>=plan.min)||(before<plan.target&&after>=plan.target)||(before<BONUS&&after>=BONUS)))burst(src);
}

["e0","e1","e2"].forEach(function(id,i){var el=$(id);el.value=state.ends[i];el.onchange=function(){if(el.value){state.ends[i]=el.value;state.setUpd=Date.now();save();render()}}});
var rw=$("reward"),pn=$("penalty");rw.value=state.reward;pn.value=state.penalty;
rw.onchange=function(){state.reward=rw.value;state.setUpd=Date.now();save();render()};pn.onchange=function(){state.penalty=pn.value;state.setUpd=Date.now();save();render()};

/* nav: switches pages, so only a little is on screen at once */
var NAVMAP={n0:[0,0],n1:[1,1],n3:[2,3]};
function setView(v,navI){
 for(var i=0;i<3;i++)$("v"+i).classList.toggle("on",i===v);
 $("navIn").style.setProperty("--i",navI);
 ["n0","n1","n3"].forEach(function(id,j){$(id).classList.toggle("on",j===navI)});
 window.scrollTo({top:0,behavior:REDUCED?"auto":"smooth"});
}
$("n0").onclick=function(){setView(0,0)};$("n1").onclick=function(){setView(1,1)};$("n3").onclick=function(){setView(2,2)};$("gear").onclick=function(){setView(2,2)};

/* ---------- GitHub sync ---------- */
function refreshSettings(){["e0","e1","e2"].forEach(function(id,i){$(id).value=state.ends[i]});rw.value=state.reward;pn.value=state.penalty}
function mergeState(remote){
 if(!remote||typeof remote!=="object"||!remote.days)return false;
 var changed=false,k,ru=remote.dayUpd||{};state.dayUpd=state.dayUpd||{};
 var fresh=!Object.keys(state.days).length&&!state.setUpd;
 for(k in remote.days){var r=remote.days[k],l=state.days[k];
  if(!l){state.days[k]=r;if(ru[k])state.dayUpd[k]=ru[k];changed=true;continue}
  if(JSON.stringify(r)===JSON.stringify(l)){if((ru[k]||0)>(state.dayUpd[k]||0))state.dayUpd[k]=ru[k];continue}
  var lt=state.dayUpd[k]||0,rt=ru[k]||0,takeR=rt!==lt?rt>lt:sum(r)>sum(l);
  if(takeR){state.days[k]=r;state.dayUpd[k]=rt;changed=true}}
 if(fresh||(remote.setUpd||0)>(state.setUpd||0)){
  var a=JSON.stringify([state.start,state.ends,state.reward,state.penalty]);
  if(remote.start)state.start=remote.start;if(remote.ends)state.ends=remote.ends;
  state.reward=remote.reward||"";state.penalty=remote.penalty||"";state.setUpd=remote.setUpd||state.setUpd||0;
  if(a!==JSON.stringify([state.start,state.ends,state.reward,state.penalty]))changed=true}
 if(changed)refreshSettings();
 return changed}
var GH=(function(){
 var CK="duo_sync_cfg",cfg={},timer=null,busy=false,again=false,sha=null,lastOk="";
 try{cfg=JSON.parse(localStorage.getItem(CK))||{}}catch(e){}
 var dot=$("syncDot"),st=$("ghStatus");
 function on(){return !!(cfg.repo&&cfg.token)}
 function show(kind,msg){dot.className=kind||"";st.textContent=msg}
 function enc(t){return btoa(unescape(encodeURIComponent(t)))}
 function dec(t){return decodeURIComponent(escape(atob(t.replace(/\s/g,""))))}
 function url(){return "https://api.github.com/repos/"+cfg.repo+"/contents/"+encodeURI(cfg.path||"progress.json")}
 function hdr(x){var h={"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};for(var k in x)h[k]=x[k];return h}
 function fail(status){var e=new Error("HTTP "+status);e.status=status;return e}
 function pull(){return fetch(url()+"?t="+Date.now(),{headers:hdr(),cache:"no-store"}).then(function(r){
  if(r.status===404){sha=null;return null}
  if(!r.ok)throw fail(r.status);
  return r.json().then(function(j){sha=j.sha;return j.content?JSON.parse(dec(j.content)):null})})}
 function push(){var body={message:"progress "+new Date().toISOString().slice(0,16).replace("T"," "),content:enc(JSON.stringify(state,null,1))};
  if(sha)body.sha=sha;
  return fetch(url(),{method:"PUT",headers:hdr({"Content-Type":"application/json"}),body:JSON.stringify(body),keepalive:true}).then(function(r){
   if(!r.ok)throw fail(r.status);return r.json()}).then(function(j){sha=j.content&&j.content.sha||sha})}
 function msg(e){var c=e&&e.status;
  if(c===401)return"Token ভুল বা expire হয়ে গেছে।";
  if(c===403)return"Token-এর Contents: Read and write permission নেই (বা rate limit)।";
  if(c===404||c===422)return"Repo খুঁজে পাওয়া যাচ্ছে না, নাম ঠিক আছে? Token কি ওই repo-র জন্য?";
  if(c)return"Error "+c;return"Offline, net এলে আবার চেষ্টা করবে।"}
 function attempt(n){return pull().then(function(remote){
  if(remote&&mergeState(remote)){persist();render()}
  if(remote&&JSON.stringify(remote)===JSON.stringify(state))return;
  return push()}).catch(function(e){if(n<1&&(e.status===409||e.status===422)&&sha!==null)return attempt(n+1);throw e})}
 function sync(){if(!on())return Promise.resolve();
  if(busy){again=true;return Promise.resolve()}
  busy=true;show("pend","Syncing…");
  return attempt(0).then(function(){var d=new Date();lastOk="Synced "+pad(d.getHours())+":"+pad(d.getMinutes());show("ok",lastOk)})
   .catch(function(e){show("err",msg(e))})
   .then(function(){busy=false;if(again){again=false;schedule()}})}
 function schedule(){if(!on())return;show("pend","Saving…");clearTimeout(timer);timer=setTimeout(sync,2500)}
 $("gh_repo").value=cfg.repo||"";$("gh_token").value=cfg.token||"";$("gh_path").value=cfg.path||"progress.json";
 if(on())show("pend","Starting sync…");
 $("gh_save").onclick=function(){
  var repo=$("gh_repo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/+$/,"");
  var tok=$("gh_token").value.trim(),path=$("gh_path").value.trim()||"progress.json";
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){show("err","Repo লিখতে হবে username/repo এই format-এ।");return}
  if(!tok){show("err","Token দাও।");return}
  cfg={repo:repo,token:tok,path:path};$("gh_repo").value=repo;$("gh_path").value=path;sha=null;
  try{localStorage.setItem(CK,JSON.stringify(cfg))}catch(e){}
  clearTimeout(timer);sync()};
 document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"){if(timer){clearTimeout(timer);timer=null;sync()}}else sync()});
 window.addEventListener("online",sync);
 setTimeout(sync,900);
 return{schedule:schedule,sync:sync}})();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});

buildStatic();
setTimeout(function(){render();ready=true},350);
setInterval(function(){var a=document.activeElement;if(!a||a.tagName!=="INPUT")render()},60000);
</script>
